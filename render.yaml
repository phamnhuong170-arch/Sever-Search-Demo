# render.yaml — Render Blueprint
# Đặt file này ở gốc repo GitHub. Trên Render: New -> Blueprint -> connect repo này ->
# Render tự đọc file này và tạo sẵn service, không cần tự tay điền Build/Start command.

services:
  - type: web
    name: search-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
